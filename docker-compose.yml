version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.${FRONTEND_ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rust-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.${ENV:-dev}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - cargo-registry:/usr/local/cargo/registry
    environment:
      - RUST_LOG=debug
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app_db
    restart: unless-stopped
    networks:
      - rust-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rust-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"  # HTTP API
      - "9000:9000"  # Native protocol
    volumes:
      - ./clickhouse_data/data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
    networks:
      - rust-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O - http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  cargo-registry:
  clickhouse_data:
  postgres_data:

networks:
  rust-network:
    driver: bridge